name: Sync bookings from iCal

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_bookings.py
      - name: Commit if changed
        run: |
          git config user.name "gelaland-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bookings.json
          git diff --cached --quiet || git commit -m "Sync bookings from iCal"
          git push
